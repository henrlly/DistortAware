[project]
name = "ai-detection-tool"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "torch>=2.13.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_detection"]

[tool.pyright]
reportMissingTypeStubs = false
